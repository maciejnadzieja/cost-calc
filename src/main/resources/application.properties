# Application Configuration
spring.application.name=cost-calc
server.port=8888
server.forward-headers-strategy=native

# MongoDB Configuration
spring.data.mongodb.host=localhost
spring.data.mongodb.port=27017
spring.data.mongodb.database=cost_calc
spring.data.mongodb.username=cost_calc_user
spring.data.mongodb.password=cost_calc_password
spring.data.mongodb.authentication-database=cost_calc
spring.data.mongodb.auto-index-creation=true
spring.data.mongodb.uuid-representation=standard

# Keycloak Configuration
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:9090/realms/cost-calc-realm
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:9090/realms/cost-calc-realm/protocol/openid-connect/certs

# Backend-only directory client; no secret is provided in source control.
app.keycloak-directory.client-id=${KEYCLOAK_DIRECTORY_CLIENT_ID:cost-calc-directory}
app.keycloak-directory.client-secret=${KEYCLOAK_DIRECTORY_CLIENT_SECRET:}
# Optional backend-reachable Keycloak base URL; the realm always comes from the JWT issuer.
app.keycloak-directory.server-url=${KEYCLOAK_DIRECTORY_SERVER_URL:}

# Logging Configuration
logging.level.com.costcalc=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.springframework.data.mongodb=INFO
logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter=DEBUG

# CORS Configuration
app.cors.allowed-origins=http://localhost:5173
app.cors.allowed-methods=*
app.cors.allowed-headers=*


costcalc.config.supported-currencies=EUR,PLN,USD

# Backend-only external material discovery.
costcalc.external-material-search.brave-api-key=${BRAVE_API_KEY:}
costcalc.external-material-search.min-request-interval=1s
costcalc.external-material-search.categories.plants[0]=ekatalog
costcalc.external-material-search.categories.plants[1]=atlas
costcalc.external-material-search.sources.ekatalog.label=e-Katalog Ro\u015blin
costcalc.external-material-search.sources.ekatalog.domain=e-katalogroslin.pl
costcalc.external-material-search.sources.ekatalog.item-path=/plants/[0-9]+,[^/;]+
costcalc.external-material-search.sources.atlas.label=Atlas Ro\u015blin
costcalc.external-material-search.sources.atlas.domain=atlas-roslin.pl
costcalc.external-material-search.sources.atlas.item-path=/gatunki/[a-zA-Z0-9-]+_[a-zA-Z0-9_.-]+[.]htm
