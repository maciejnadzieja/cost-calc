<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/default.html}">
<head>
    <title th:text="#{settings.title}">User Settings</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-body">
                        <h2 class="card-title mb-4" th:text="#{settings.title}">User Settings</h2>
                        
                        <form th:action="@{/settings}" th:object="${settings}" method="post">
                            <div class="mb-3">
                                <label for="currency" class="form-label" th:text="#{settings.currency}">Preferred Currency</label>
                                <select class="form-select" id="currency" th:field="*{currency}">
                                    <option th:each="curr : ${availableCurrencies}"
                                            th:value="${curr}"
                                            th:text="${curr}">USD</option>
                                </select>
                            </div>
                            
                            <div class="mb-3">
                                <label for="footerText" class="form-label" th:text="#{settings.footer_text}">Print Footer Text</label>
                                <textarea class="form-control" id="footerText" th:field="*{footerText}" rows="3" wrap="hard"></textarea>
                                <small class="form-text text-muted">This text will appear at the bottom of all print views. Use Shift+Enter for new lines.</small>
                            </div>
                            
                            <div class="mb-3">
                                <label for="themeColor" class="form-label" th:text="#{settings.theme_color}">Theme Color</label>
                                <div class="input-group">
                                    <input type="color" 
                                           class="form-control form-control-color" 
                                           id="colorPicker" 
                                           th:value="*{themeColor}">
                                    <input type="text" 
                                           class="form-control" 
                                           id="themeColor"
                                           name="themeColor"
                                           th:value="*{themeColor}"
                                           pattern="^#[0-9A-Fa-f]{6}$"
                                           title="Hex color code (e.g. #007bff)">
                                </div>
                                <small class="form-text text-muted" th:text="#{settings.theme_color.help}">
                                    Choose a color to customize your interface
                                </small>
                            </div>
                            
                            <div class="d-flex justify-content-between">
                                <a href="/dashboard" class="btn btn-secondary" th:text="#{settings.cancel}">Cancel</a>
                                <button type="submit" class="btn btn-primary" th:text="#{settings.save}">Save Settings</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
