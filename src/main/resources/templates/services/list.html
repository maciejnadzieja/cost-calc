<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/default.html}">
<head>
    <title th:text="#{services.title}">Services</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 th:text="#{services.title}">Services</h2>
            <a href="/services/new" class="btn btn-primary">
                <i class="bi bi-plus"></i> <span th:text="#{services.new}">Add New Service</span>
            </a>
        </div>

        <div class="card">
            <div class="card-body">
                <div th:if="${services.empty}" class="alert alert-info" th:text="#{services.list.empty}">
                    No services found. Click "Add New Service" to create one.
                </div>

                <div th:if="${!services.empty}" class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th th:text="#{services.form.name}">Name</th>
                                <th th:text="#{services.form.description}">Description</th>
                                <th th:text="#{services.form.price}">Price</th>
                                <th th:text="#{services.form.unit}">Unit</th>
                                <th th:text="#{common.actions}">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="service : ${services}">
                                <td th:text="${service.name}">Service Name</td>
                                <td th:text="${service.description}">Service Description</td>
                                <td>
                                    <span th:text="${#numbers.formatDecimal(service.price, 1, 2)}">100.00</span>
                                    <span th:text="${' ' + currency}">USD</span>
                                    <span>/</span>
                                    <span th:text="${#messages.msg('service.unit.' + service.workUnit.name().toLowerCase() + '.symbol', service.workUnit.name())}">h</span>
                                </td>
                                <td>
                                    <span th:text="${#messages.msg('service.unit.' + service.workUnit.name().toLowerCase() + '.label', service.workUnit.name())}">Hour</span>
                                </td>
                                <td>
                                    <div class="btn-group">
                                        <a th:href="@{/services/{id}/edit(id=${service.id})}" 
                                           class="btn btn-sm btn-outline-primary">
                                            <i class="bi bi-pencil"></i>
                                        </a>
                                        <form th:action="@{/services/{id}/delete(id=${service.id})}" 
                                              method="post" 
                                              class="d-inline"
                                              th:onsubmit="return confirm([[#{services.delete.confirm}]])">
                                            <button type="submit" class="btn btn-sm btn-outline-danger">
                                                <i class="bi bi-trash"></i>
                                            </button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
