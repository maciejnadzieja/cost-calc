<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/default.html}">
<head>
    <title th:text="#{nav.dashboard}">Dashboard</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="row">
            <div class="col-12">
                <h2 th:text="#{dashboard.welcome}">Welcome to Cost Calculator</h2>
                <p class="lead" th:text="#{dashboard.subtitle}">Manage your services, materials, and create professional estimates.</p>
            </div>
        </div>

        <div class="row mt-4">
            <div class="col-md-4">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title" th:text="#{dashboard.quick_actions}">Quick Actions</h5>
                        <div class="list-group">
                            <a href="/calculations/new" class="list-group-item list-group-item-action"
                               th:text="#{dashboard.create_calculation}">Create New Calculation</a>
                            <a href="/services/new" class="list-group-item list-group-item-action"
                               th:text="#{dashboard.add_service}">Add New Service</a>
                            <a href="/materials/new" class="list-group-item list-group-item-action"
                               th:text="#{dashboard.add_material}">Add New Material</a>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-8">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title" th:text="#{dashboard.recent_activity}">Recent Activity</h5>
                        <p th:text="#{dashboard.recent_activity.empty}">Your recent calculations and estimates will appear here.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
