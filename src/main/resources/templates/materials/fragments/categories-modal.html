<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div class="modal fade" id="categoriesModal" tabindex="-1" aria-labelledby="categoriesModalLabel" aria-hidden="true" th:fragment="categories-modal">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="categoriesModalLabel" th:text="#{materials.form.categories}">Categories</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <ul class="list-group">
                    <li th:each="cat : ${categories}" class="list-group-item d-flex justify-content-between align-items-center">
                        <span th:text="${cat.category}">Category</span>
                        <span class="badge bg-primary rounded-pill" th:text="${cat.count}">0</span>
                        <form th:action="@{/materials/category/{category}/delete(category=${cat.category})}" method="post" class="ms-2 d-inline" th:onsubmit="return confirm('Delete all materials in this category?')">
                            <button type="submit" class="btn btn-sm btn-outline-danger">
                                <i class="bi bi-trash"></i>
                            </button>
                        </form>
                    </li>
                </ul>
            </div>
        </div>
    </div>
</div>
</html>
