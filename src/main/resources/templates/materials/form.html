<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/default.html}">
<head>
    <title th:text="${material.id == null} ? #{materials.new} : #{materials.edit}">Material Form</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title mb-0" th:text="${material.id == null} ? #{materials.new} : #{materials.edit}">Material Form</h3>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/materials}"
                              th:object="${material}" method="post">

                            <input type="hidden" th:field="*{id}" />
                            
                            <div class="mb-3">
                                <label for="name" class="form-label" th:text="#{materials.form.name}">Name</label>
                                <input type="text" class="form-control" id="name" th:field="*{name}" required>
                            </div>
                            
                            <div class="mb-3">
                                <label for="description" class="form-label" th:text="#{materials.form.description}">Description</label>
                                <textarea class="form-control" id="description" th:field="*{description}" rows="3"></textarea>
                            </div>
                            
                            <div class="mb-3">
                                <label for="category" class="form-label" th:text="#{materials.form.category}">Category</label>
                                <input type="text" class="form-control" id="category" th:field="*{category}">
                            </div>
                            
                            <div class="mb-3">
                                <label for="price" class="form-label" th:text="#{materials.form.price}">Price</label>
                                <div class="input-group">
                                    <span class="input-group-text" th:text="${currency}">USD</span>
                                    <input type="number" class="form-control" id="price" th:field="*{price}" 
                                           step="0.01" min="0" required>
                                    <select class="form-select" id="unit" th:field="*{unit}" style="max-width: 150px;">
                                        <option th:each="unit : ${T(com.costcalc.api.model.MaterialUnit).values()}"
                                                th:value="${unit.name()}"
                                                th:text="${#messages.msg('material.unit.' + unit.name().toLowerCase() + '.label', unit.name()) + ' (' + #messages.msg('material.unit.' + unit.name().toLowerCase() + '.symbol', unit.name()) + ')'}">
                                            Piece (pc)
                                        </option>
                                    </select>
                                </div>
                            </div>
                            
                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-primary" th:text="#{materials.form.save}">Save</button>
                                <a href="/materials" class="btn btn-secondary" th:text="#{materials.form.cancel}">Cancel</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
