<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <div th:fragment="details">
        <input type="hidden" th:field="*{id}" />

        <div class="mb-3">
            <label for="name" class="form-label" th:text="#{calculations.form.name}">Name</label>
            <input type="text" class="form-control" id="name" th:field="*{name}" required>
        </div>

        <div class="mb-3">
            <label for="description" class="form-label" th:text="#{calculations.form.description}">Description</label>
            <textarea class="form-control" id="description" th:field="*{description}" rows="3"></textarea>
        </div>

        <div class="mb-3">
            <label for="currency" class="form-label" th:text="#{calculations.form.currency}">Currency</label>
            <input type="text" class="form-control" id="currency" th:field="*{currency}" readonly>
        </div>
    </div>
</body>
</html>
