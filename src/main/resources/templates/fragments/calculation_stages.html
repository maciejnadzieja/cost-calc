<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <div th:fragment="stages" id="stages">        
        <div th:each="stage, stageStat : *{stages}" class="card mb-3">
            <div class="card-body">
                <div class="p-3 mb-3 bg-light rounded">
                    <h5 class="card-title" th:text="#{calculations.form.stage} + ' ' + ${stageStat.count}">Stage 1</h5>
                    <div class="mb-3">
                        <label th:for="${'stages[' + stageStat.index + '].name'}" class="form-label" th:text="#{calculations.form.stage.name}">Stage Name</label>
                        <input type="text" class="form-control" 
                                th:field="*{stages[__${stageStat.index}__].name}" required>
                    </div>
                </div>
                <div class="p-3 mb-3 bg-light rounded">
                    <h6 th:text="#{calculations.form.services}">Services</h6>
                    <div class="mb-3">
                        <div class="row">
                            <div class="col-md-8">
                                <select class="form-control service-search">
                                    <option value="" th:text="#{calculations.form.services}"></option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <button type="button" class="btn btn-secondary add-item" th:text="#{calculations.form.add}">Add</button>
                            </div>
                        </div>
                    </div>
                    <div th:id="${'services-' + stageStat.index}" class="mb-3">
                        <div th:each="service, serviceStat : ${stage.services}" class="row mb-2">
                            <div class="col-md-4">
                                <input type="text" class="form-control" 
                                        th:field="*{stages[__${stageStat.index}__].services[__${serviceStat.index}__].name}">
                            </div>
                            <div class="col-md-2">
                                <input type="number" class="form-control" step="0.01"
                                        th:field="*{stages[__${stageStat.index}__].services[__${serviceStat.index}__].quantity}"
                                        th:placeholder="#{calculations.form.quantity}">
                            </div>
                            <div class="col-md-2">
                                <select class="form-control unit-select"
                                        th:field="*{stages[__${stageStat.index}__].services[__${serviceStat.index}__].unit}">
                                    <option th:each="unit : ${workUnits}"
                                            th:value="${unit.name}"
                                            th:text="#{${unit.label}}"></option>
                                </select>
                            </div>
                            <div class="col-md-2">
                                <button type="button" class="btn btn-danger remove-item" data-bs-toggle="tooltip" data-bs-placement="top" th:title="#{common.remove}">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="p-3 mb-3 bg-light rounded">
                    <h6 class="mt-3">
                        <span th:text="#{calculations.form.materials}">Materials</span>
                        <div class="d-inline-flex flex-wrap ms-2">
                            <div th:each="summary : ${stage.materialsSummary}" class="me-2">
                                <span class="badge bg-secondary" th:text="${summary.value} + ' ' + #{'material.unit.' + ${summary.key.toLowerCase()} + '.label'}"></span>
                            </div>
                        </div>
                    </h6>

                    <div class="mb-3">
                        <div class="row">
                            <div class="col-md-8">
                                <select class="form-control material-search">
                                    <option value="" th:text="#{calculations.form.materials}"></option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <button type="button" class="btn btn-secondary add-item" th:text="#{calculations.form.add}">Add</button>
                            </div>
                        </div>
                    </div>
                    <div th:id="${'materials-' + stageStat.index}" class="mb-3">
                        <div th:each="material, materialStat : ${stage.materials}" class="row mb-2">
                            <div class="col-md-4">
                                <input type="text" class="form-control" 
                                        th:field="*{stages[__${stageStat.index}__].materials[__${materialStat.index}__].name}">
                            </div>
                            <div class="col-md-2">
                                <input type="number" class="form-control" step="0.01"
                                        th:field="*{stages[__${stageStat.index}__].materials[__${materialStat.index}__].quantity}"
                                        th:placeholder="#{calculations.form.quantity}">
                            </div>
                            <div class="col-md-2">
                                <select class="form-control unit-select"
                                        th:field="*{stages[__${stageStat.index}__].materials[__${materialStat.index}__].unit}">
                                    <option th:each="unit : ${materialUnits}"
                                            th:value="${unit.name}"
                                            th:text="#{${unit.label}}"></option>
                                </select>
                            </div>
                            <div class="col-md-2">
                                <input type="number" class="form-control" step="0.01"
                                        th:field="*{stages[__${stageStat.index}__].materials[__${materialStat.index}__].unitPrice}"
                                        th:placeholder="#{calculations.form.price}">
                            </div>
                            <div class="col-md-2">
                                <button type="button" class="btn btn-danger remove-item" data-bs-toggle="tooltip" data-bs-placement="top" th:title="#{common.remove}">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="p-3 bg-light rounded">
                    <div class="mb-3">
                        <button type="submit" class="btn btn-primary" th:text="#{calculations.form.submit}">Save Calculation</button>
                        <a th:href="@{/calculations}" class="btn btn-secondary" th:text="#{common.cancel}">Cancel</a>
                        <button type="button" class="btn btn-danger remove-stage" data-bs-toggle="tooltip" data-bs-placement="top" th:title="#{calculations.form.remove.stage}">
                            <i class="bi bi-trash"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
