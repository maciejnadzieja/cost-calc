<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
</head>
<body>
    <nav th:fragment="nav(activeTab)" class="navbar navbar-expand-lg navbar-dark" th:style="${userSettings != null ? 'background-color: ' + userSettings.themeColor : 'background-color: #0d6efd'}">
        <div class="container">
            <a class="navbar-brand" href="/" th:text="#{app.name}">Cost Calculator</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto" sec:authorize="isAuthenticated()">
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${activeTab == 'calculations'} ? 'active' : ''"
                           href="/calculations">
                            <i class="bi bi-calculator"></i> <span th:text="#{nav.calculations}">Calculations</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${activeTab == 'services'} ? 'active' : ''"
                           href="/services">
                            <i class="bi bi-gear"></i> <span th:text="#{nav.services}">Services</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${activeTab == 'materials'} ? 'active' : ''"
                           href="/materials">
                            <i class="bi bi-box-seam"></i> <span th:text="#{nav.materials}">Materials</span>
                        </a>
                    </li>
                </ul>
                <ul class="navbar-nav">
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="languageDropdown" role="button" 
                           data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="bi bi-globe"></i>
                            <span th:text="${#locale.language.toUpperCase()}">EN</span>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item" href="?lang=en">English</a></li>
                            <li><a class="dropdown-item" href="?lang=pl">Polski</a></li>
                        </ul>
                    </li>
                    <li class="nav-item" sec:authorize="isAuthenticated()">
                        <a class="nav-link" th:classappend="${activeTab == 'settings'} ? 'active' : ''"
                           href="/settings">
                            <i class="bi bi-gear"></i> <span th:text="#{nav.settings}">Settings</span>
                        </a>
                    </li>
                    <li class="nav-item" sec:authorize="isAuthenticated()">
                        <form th:action="@{/logout}" method="post" class="d-inline">
                            <button type="submit" class="btn nav-link">
                                <i class="bi bi-box-arrow-right"></i> <span th:text="#{nav.logout}">Logout</span>
                                (<span th:text="${#authentication.principal instanceof T(org.springframework.security.oauth2.core.user.OAuth2User) ? #authentication.principal.attributes.email : #authentication.name}">username</span>)
                            </button>
                        </form>
                    </li>
                    <li class="nav-item" sec:authorize="!isAuthenticated()">
                        <a class="nav-link" href="/login">
                            <i class="bi bi-box-arrow-in-right"></i> <span th:text="#{nav.login}">Login</span>
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
</body>
</html>
