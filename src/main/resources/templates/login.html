<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{login.title} + ' - ' + #{app.name}">Login - Cost Calculator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container">
        <div class="row justify-content-center mt-5">
            <div class="col-md-6 col-lg-4">
                <div class="card shadow">
                    <div class="card-body">
                        <h3 class="card-title text-center mb-4" th:text="#{app.name}">Cost Calculator</h3>
                        
                        <div th:if="${param.error}" class="alert alert-danger" th:text="#{login.error}">
                            Invalid username or password.
                        </div>
                        <div th:if="${param.logout}" class="alert alert-success" th:text="#{login.logout}">
                            You have been logged out.
                        </div>
                        
                        <form th:action="@{/login}" method="post">
                            <div class="mb-3">
                                <label for="username" class="form-label" th:text="#{login.email}">Email</label>
                                <input type="email" class="form-control" id="username" name="username" required autofocus>
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label" th:text="#{login.password}">Password</label>
                                <input type="password" class="form-control" id="password" name="password" required>
                            </div>
                            <div class="mb-3 form-check">
                                <input type="checkbox" class="form-check-input" id="remember-me" name="remember-me">
                                <label class="form-check-label" for="remember-me" th:text="#{login.remember_me}">Remember me</label>
                            </div>
                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary" th:text="#{login.submit}">Sign In</button>
                            </div>
                        </form>
                        
                        <div class="text-center mt-3">
                            <div class="mb-3">
                                <span th:text="#{login.or}">or</span>
                            </div>
                            <a href="/oauth2/authorization/google" class="btn btn-outline-dark w-100">
                                <img src="https://www.google.com/favicon.ico" alt="Google" width="20" height="20" class="me-2">
                                <span th:text="#{login.google}">Sign in with Google</span>
                            </a>
                        </div>
                        
                        <div class="text-center mt-3">
                            <a href="/register" class="text-decoration-none" th:text="#{login.register}">Create an account</a>
                            <span class="mx-2">|</span>
                            <a href="/forgot-password" class="text-decoration-none" th:text="#{login.forgot_password}">Forgot password?</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
