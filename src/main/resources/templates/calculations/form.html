<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/default.html}">
<head>
    <title th:text="${calculation?.id} ? #{calculations.edit.title} : #{calculations.new.title}">New Calculation</title>
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
</head>
<body>
    <div layout:fragment="content">
        <h2 th:text="${calculation?.id} ? #{calculations.edit.title} : #{calculations.new.title}">New Calculation</h2>
        
        <form th:action="@{/calculations}" method="post" th:object="${calculationForm}" id="calculationForm">
            <div th:if="${calculationSaved}" class="alert alert-success alert-dismissible fade show" role="alert" id="save-success-alert">
                <span th:text="#{calculations.form.saved}">Calculation saved successfully!</span>
            </div>
            <div th:replace="~{fragments/calculation_details :: details}"></div>

            <div th:replace="~{fragments/calculation_stages :: stages}"></div>
            
            <button type="button" class="btn btn-secondary mb-3" id="add-stage" th:text="#{calculations.form.add.stage}">Add Stage</button>
            
            <div class="mb-3">
                <button type="submit" class="btn btn-primary" th:text="#{calculations.form.submit}">Save Calculation</button>
                <a th:href="@{/calculations}" class="btn btn-secondary" th:text="#{common.cancel}">Cancel</a>
            </div>
        </form>
    </div>
    
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
    <script th:inline="javascript">
        async function fetchStageTemplate(index) {
            try {
                const response = await fetch('/calculations/templates/stage?index=' + index);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                return response.text();
            } catch (error) {
                console.error("Could not fetch stage template:", error);
                // Fallback or error handling
                return `<div class="alert alert-danger">Error loading stage template.</div>`;
            }
        }

        async function fetchItemTemplate(itemId, stageIndex, itemIndex, type) {
            try {
                const response = await fetch(`/calculations/templates/item?stageIndex=${stageIndex}&itemId=${itemId}&itemIndex=${itemIndex}&type=${type}`);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                return response.text();
            } catch (error) {
                console.error("Could not fetch stage template:", error);
                // Fallback or error handling
                return `<div class="alert alert-danger">Error loading item template.</div>`;
            }
        }

        $(document).ready(async function() {
            const currency = /*[[${calculationForm.currency}]]*/ 'XXX'
            const messages = {
                stage: /*[[#{calculations.form.stage}]]*/ 'Stage',
                stageName: /*[[#{calculations.form.stage.name}]]*/ 'Stage Name',
                defaultStageName: /*[[#{calculations.form.defaultStageName}]]*/ 'Stage {0}',
                services: /*[[#{calculations.form.services}]]*/ 'Services',
                materials: /*[[#{calculations.form.materials}]]*/ 'Materials',
                add: /*[[#{calculations.form.add}]]*/ 'Add',
                remove: /*[[#{common.remove}]]*/ 'Remove',
                removeStage: /*[[#{calculations.form.remove.stage}]]*/ 'Remove Stage',
                unit: /*[[#{calculations.form.unit}]]*/ 'Unit',
                price: /*[[#{calculations.form.price}]]*/ 'Price',
                quantity: /*[[#{calculations.form.quantity}]]*/ 'Quantity',
                lang: /*[[${#locale.language}]]*/ 'en',
                error: {
                    emptyQuantity: /*[[#{calculations.form.error.emptyQuantity}]]*/ 'Quantity is required for all items',
                    invalidQuantity: /*[[#{calculations.form.error.invalidQuantity}]]*/ 'Quantity must be a positive number',
                    emptyName: /*[[#{calculations.form.error.emptyName}]]*/ 'Name is required for all items',
                    emptyUnit: /*[[#{calculations.form.error.emptyUnit}]]*/ 'Unit is required for all items',
                    emptyPrice: /*[[#{calculations.form.error.emptyPrice}]]*/ 'Price is required for all items',
                    invalidPrice: /*[[#{calculations.form.error.invalidPrice}]]*/ 'Price must be a positive number'
                }
            };

            // Initialize Select2 for existing selects
            initializeSelect2();

            // Initialize tooltips
            var tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'))
            var tooltipList = tooltipTriggerList.map(function (tooltipTriggerEl) {
                return new bootstrap.Tooltip(tooltipTriggerEl)
            })
            
            // Hide success alert after 3 seconds
            setTimeout(function() {
                $('#save-success-alert').alert('close');
            }, 3000);
            
            // Add stage
            $('#add-stage').click(async function() {
                const stageIndex = $('#stages .card').length;
                const stageHtml = await fetchStageTemplate(stageIndex)

                $('#stages').append(stageHtml);
                initializeSelect2(); // Initialize Select2 for new selects
                updateStageNumbers();
            });
            
            // Remove stage
            $(document).on('click', '.remove-stage', function() {
                $(this).closest('.card').remove();
                updateStageNumbers();
            });

            // Remove item
            $(document).on('click', '.remove-item', function() {
                $(this).closest('.row').remove();
            });

            function initializeSelect2() {
                // Initialize service selects
                $('.service-search').each(function() {
                    const $search = $(this);
                    $search.select2({
                        ajax: {
                            url: '/api/services/search',
                            dataType: 'json',
                            delay: 250,
                            data: function(params) {
                                return {
                                    query: params.term || ''
                                };
                            },
                            processResults: function(data) {
                                return {
                                    results: data.map(function(item) {
                                        return {
                                            id: item.id,
                                            text: item.name,
                                            price: item.price,
                                            workUnit: item.workUnit
                                        };
                                    })
                                };
                            }
                        },
                        minimumInputLength: 0
                    }).on('select2:select', function(e) {
                        const data = e.params.data;
                        $search.data('selected', data);
                        
                        // Update the button's data attributes
                        const $button = $search.closest('.row').find('.add-item');
                        $button.data('selected-data', data);
                    });
                });

                // Initialize material selects
                $('.material-search').each(function() {
                    const $search = $(this);
                    $search.select2({
                        ajax: {
                            url: '/api/materials/search',
                            dataType: 'json',
                            delay: 250,
                            data: function(params) {
                                return {
                                    query: params.term || ''
                                };
                            },
                            processResults: function(data) {
                                return {
                                    results: data.map(function(item) {
                                        return {
                                            id: item.id,
                                            text: item.name + ' (' + item.price + ' ' + currency + ')  #' + item.category,
                                            price: item.price,
                                            unit: item.unit
                                        };
                                    })
                                };
                            }
                        },
                        minimumInputLength: 0
                    }).on('select2:select', function(e) {
                        const data = e.params.data;
                        $search.data('selected', data);
                        
                        // Update the button's data attributes
                        const $button = $search.closest('.row').find('.add-item');
                        $button.data('selected-data', data);
                    });
                });

                // Handle add button clicks
                $('.add-item').click(async function() {
                    const $button = $(this);
                    const data = $button.data('selected-data');

                    if (!data) return;

                    const $row = $button.closest('.row');
                    const $search = $row.find('.service-search, .material-search');
                    const stageIndex = $search.closest('.card').index();
                    const type = $search.hasClass('service-search') ? 'services' : 'materials';
                    const itemIndex = $(`#${type}-${stageIndex} .row`).length;

                    const html = await fetchItemTemplate(data.id, stageIndex, itemIndex, type);

                    $(`#${type}-${stageIndex}`).append(html);
                    $search.val('').trigger('change');
                    $search.data('selected', null);
                    $button.data('selected-data', null);
                });
            }
            
            function updateStageNumbers() {
                $('#stages .card-title').each(function(index) {
                    $(this).text(`${messages.stage} ${index + 1}`);
                });
            }
            
            // Form submission validation
            $('#calculationForm').on('submit', function(e) {
                let hasError = false;
                let errorMessages = [];
                
                // Validate all items
                $('.row.mb-2').each(function() {
                    const $row = $(this);
                    
                    // Validate name
                    const $name = $row.find('input[name$=".name"]');
                    if (!$name.val() || $name.val().trim() === '') {
                        $name.addClass('is-invalid');
                        hasError = true;
                        if (!errorMessages.includes(messages.error.emptyName)) {
                            errorMessages.push(messages.error.emptyName);
                        }
                    } else {
                        $name.removeClass('is-invalid');
                    }
                    
                    // Validate quantity
                    const $quantity = $row.find('input[name$=".quantity"]');
                    const quantityValue = parseFloat($quantity.val());
                    if (isNaN(quantityValue) || quantityValue <= 0) {
                        $quantity.addClass('is-invalid');
                        hasError = true;
                        if (!errorMessages.includes(messages.error.invalidQuantity)) {
                            errorMessages.push(messages.error.invalidQuantity);
                        }
                    } else {
                        $quantity.removeClass('is-invalid');
                    }
                    
                    // Validate unit
                    const $unit = $row.find('select[name$=".unit"]');
                    if (!$unit.val() || $unit.val().trim() === '') {
                        $unit.addClass('is-invalid');
                        hasError = true;
                        if (!errorMessages.includes(messages.error.emptyUnit)) {
                            errorMessages.push(messages.error.emptyUnit);
                        }
                    } else {
                        $unit.removeClass('is-invalid');
                    }
                    
                    // Validate price
                    const $price = $row.find('input[name$=".unitPrice"]');
                    const priceValue = parseFloat($price.val());
                    if (isNaN(priceValue) || priceValue < 0) {
                        $price.addClass('is-invalid');
                        hasError = true;
                        if (!errorMessages.includes(messages.error.invalidPrice)) {
                            errorMessages.push(messages.error.invalidPrice);
                        }
                    } else {
                        $price.removeClass('is-invalid');
                    }
                });
                
                if (hasError) {
                    e.preventDefault();
                    alert(errorMessages.join('\n'));
                    return false;
                }
                
                return true;
            });
        });
    </script>
</body>
</html>
