<div class="row mb-2">
    <div class="col-md-4">
        <input type="text" class="form-control" th:name="${fieldNamePrefix} + 'name'" th:value="${itemName}">
    </div>
    <div class="col-md-2">
        <input type="number" class="form-control" step="0.01" th:name="${fieldNamePrefix} + 'quantity'" th:placeholder="#{calculations.form.quantity}">
    </div>
    <div class="col-md-2">
        <select class="form-control unit-select" th:name="${fieldNamePrefix} + 'unit'">
            <option th:each="unit : ${units}"
                    th:value="${unit.name}"
                    th:text="#{${unit.label}}"
                    th:selected="${unit.name == itemUnit}"></option>
        </select>
    </div>
    <div class="col-md-2">
        <input type="number" class="form-control" step="0.01" th:value="${itemPrice}" th:name="${fieldNamePrefix} + 'unitPrice'" th:placeholder="#{calculations.form.price}">
    </div>
    <div class="col-md-2">
        <button type="button" class="btn btn-danger remove-item" th:text="#{common.remove}"></button>
    </div>
</div>
