<div class="card mb-3">
    <div class="card-body">
        <h5 class="card-title" th:text="#{calculations.form.defaultStageName} + ' ' + ${stage}"></h5>

        <div class="mb-3">
            <label class="form-label" th:text="#{calculations.form.stage.name}"></label>
            <input type="text" class="form-control" th:name="'stages['+${index}+'].name'" required th:value="#{calculations.form.defaultStageName} + ' ' + ${stage}">
        </div>

        <h6 th:text="#{calculations.form.services}"></h6>
        <div class="mb-3">
            <div class="row">
                <div class="col-md-8">
                    <select class="form-control service-search">
                        <option value="" th:text="#{calculations.form.services}"></option>
                    </select>
                </div>
                <div class="col-md-4">
                    <button type="button" class="btn btn-secondary add-item" th:text="#{calculations.form.add}"></button>
                </div>
            </div>
        </div>
        <div th:id="'services-' + ${index}" class="mb-3"></div>

        <h6 class="mt-3" th:text="#{calculations.form.materials}"></h6>
        <div class="mb-3">
            <div class="row">
                <div class="col-md-8">
                    <select class="form-control material-search">
                        <option value="" th:text="#{calculations.form.materials}"></option>
                    </select>
                </div>
                <div class="col-md-4">
                    <button type="button" class="btn btn-secondary add-item" th:text="#{calculations.form.add}"></button>
                </div>
            </div>
        </div>
        <div th:id="'materials-' + ${index}" class="mb-3"></div>

        <button type="button" class="btn btn-danger mt-3 remove-stage" th:text="#{calculations.form.remove.stage}"></button>
    </div>
</div>
