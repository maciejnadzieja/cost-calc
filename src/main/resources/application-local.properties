# Application Configuration
spring.application.name=cost-calc-ai
server.port=8080
server.forward-headers-strategy=native

# DevTools Configuration
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

# MongoDB Configuration
spring.data.mongodb.host=localhost
spring.data.mongodb.port=27017
spring.data.mongodb.database=cost_calc
spring.data.mongodb.username=cost_calc_user
spring.data.mongodb.password=cost_calc_password
spring.data.mongodb.authentication-database=cost_calc
spring.data.mongodb.auto-index-creation=true
spring.data.mongodb.uuid-representation=standard

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# Logging Configuration
logging.level.com.costcalc=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
logging.level.org.springframework.data.mongodb=INFO

# Server Configuration
server.error.include-message=always
server.error.include-binding-errors=always

# OAuth2 Configuration
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email

app.admin.email=${APP_ADMIN_EMAIL:admin@cost-calc.eu}
app.admin.password=${APP_ADMIN_PASSWORD:admin#123!}
