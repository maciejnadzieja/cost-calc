version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
      MONGO_INITDB_DATABASE: cost_calc
    ports:
      - "27017:27017"
    volumes:
      - ./mongodb_data:/data/db
      - ./docker/mongodb/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro

  api:
    build: .
    container_name: api
    restart: unless-stopped
    ports:
      - "8888:8888"
    environment:
      - SPRING_DATA_MONGODB_HOST=mongodb
      - SPRING_DATA_MONGODB_PORT=27017
      - SPRING_DATA_MONGODB_DATABASE=cost_calc
      - SPRING_DATA_MONGODB_USERNAME=cost_calc_user
      - SPRING_DATA_MONGODB_PASSWORD=cost_calc_password
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=http://host.docker.internal:9090/realms/cost-calc-realm
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI=http://host.docker.internal:9090/realms/cost-calc-realm/protocol/openid-connect/certs
      - KEYCLOAK_DIRECTORY_CLIENT_ID=${KEYCLOAK_DIRECTORY_CLIENT_ID:-cost-calc-directory}
      # Development fixture only; use a private override outside local development.
      - KEYCLOAK_DIRECTORY_CLIENT_SECRET=${KEYCLOAK_DIRECTORY_CLIENT_SECRET:-cost-calc-local-directory-secret}
      - KEYCLOAK_DIRECTORY_SERVER_URL=${KEYCLOAK_DIRECTORY_SERVER_URL:-http://keycloak:8080}
      - APP_CORS_ALLOWED_ORIGINS=http://localhost:5173
      - APP_CORS_ALLOWED_METHODS=*
      - APP_CORS_ALLOWED_HEADERS=*
    depends_on:
      mongodb:
        condition: service_started
      keycloak:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cost_calc_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8888/api
      - VITE_KEYCLOAK_URL=http://host.docker.internal:9090/
      - VITE_KEYCLOAK_REALM=cost-calc-realm
      - VITE_KEYCLOAK_CLIENT_ID=cost-calc-client
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    depends_on:
      - api

  keycloak:
    image: quay.io/keycloak/keycloak:26.4.0
    container_name: keycloak
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=admin
      - KEYCLOAK_DIRECTORY_CLIENT_ID=${KEYCLOAK_DIRECTORY_CLIENT_ID:-cost-calc-directory}
      - KEYCLOAK_DIRECTORY_CLIENT_SECRET=${KEYCLOAK_DIRECTORY_CLIENT_SECRET:-cost-calc-local-directory-secret}
    command: [ "start-dev", "--import-realm" ]
    ports:
      - "9090:8080"
    volumes:
      - ./docker/keycloak/realm-config.json:/opt/keycloak/data/import/cost-calc-realm-realm.json:ro
      - ./docker/keycloak/cost-calc-theme:/opt/keycloak/themes/cost-calc-theme
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/localhost/8080;
          printf 'GET /realms/cost-calc-realm/.well-known/openid-configuration HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3;
          read -r protocol code rest <&3;
          (( code == 200 ))
      interval: 5s
      timeout: 5s
      start_period: 60s
      retries: 20
