version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: cost_calc_mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
      MONGO_INITDB_DATABASE: cost_calc
    ports:
      - "27017:27017"
    volumes:
      - ./mongodb_data:/data/db
      - ./docker/mongodb/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro

  app:
    build: .
    container_name: cost_calc_app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATA_MONGODB_HOST=mongodb
      - SPRING_DATA_MONGODB_PORT=27017
      - SPRING_DATA_MONGODB_DATABASE=cost_calc
      - SPRING_DATA_MONGODB_USERNAME=cost_calc_user
      - SPRING_DATA_MONGODB_PASSWORD=cost_calc_password
    depends_on:
      - mongodb
